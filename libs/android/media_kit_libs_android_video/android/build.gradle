import java.io.File
import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}

task downloadDependencies(type: Exec) {   
        // Delete previously created /output subdirectory.

        def outputDir = file("$buildDir/output")
        if (outputDir.exists()) {
            outputDir.deleteDir()
        }
        outputDir.mkdirs()

        // Download all *.jar dependencies & verify their SHA-256 checksums.
        def filesToDownload = [
            ["url": "https://raw.githubusercontent.com/xweiba/libmpv-android-video-build/cb8b9de771a9afea2a65379143a1a0e11c4119e1/prebuilt/v1.3.1-mediaio.1/default-arm64-v8a.jar", "sha256": "2bbe55e50282793ff235b01ef77701a66b65ae1404cf43d09d4dbf8804584c57", "destination": file("$buildDir/v1.3.1-mediaio.1/default-arm64-v8a.jar")],
            ["url": "https://raw.githubusercontent.com/xweiba/libmpv-android-video-build/cb8b9de771a9afea2a65379143a1a0e11c4119e1/prebuilt/v1.3.1-mediaio.1/default-armeabi-v7a.jar", "sha256": "98d78274bec2844fcaba1f7c7d09bd682981ca564c2a576738e79933dc79b665", "destination": file("$buildDir/v1.3.1-mediaio.1/default-armeabi-v7a.jar")],
            ["url": "https://raw.githubusercontent.com/xweiba/libmpv-android-video-build/cb8b9de771a9afea2a65379143a1a0e11c4119e1/prebuilt/v1.3.1-mediaio.1/default-x86_64.jar", "sha256": "8a3994a1cdd4154a259f5b40ae42b6766dd468b412f41182f1241c8189d70dd7", "destination": file("$buildDir/v1.3.1-mediaio.1/default-x86_64.jar")],
            ["url": "https://raw.githubusercontent.com/xweiba/libmpv-android-video-build/cb8b9de771a9afea2a65379143a1a0e11c4119e1/prebuilt/v1.3.1-mediaio.1/default-x86.jar", "sha256": "10f60b43645ffcb9bab576c29b40b52d68b14dc9fde08dcf73dd95fb60e7fc8b", "destination": file("$buildDir/v1.3.1-mediaio.1/default-x86.jar")]
        ]

        filesToDownload.each { fileInfo ->
            def destFile = fileInfo.destination
            if (destFile.exists()) {
                def calculatedSHA256 = MessageDigest.getInstance("SHA-256").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()

                if (calculatedSHA256 != fileInfo.sha256) {
                    destFile.delete()
                    println "SHA-256 mismatch. File deleted: ${destFile}"
                }

            }

            if (!destFile.exists()) {
                destFile.parentFile.mkdirs()
                println "Downloading file from: ${fileInfo.url}"
                destFile.withOutputStream { os ->
                    os << new URL(fileInfo.url).openStream()
                }

                def calculatedSHA256 = MessageDigest.getInstance("SHA-256").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()
                if (calculatedSHA256 != fileInfo.sha256) {
                    throw new GradleException("SHA-256 verification failed for ${destFile}")
                }
            }

            copy {
                from destFile
                into outputDir
            }
        }
}

assemble.dependsOn(downloadDependencies)
