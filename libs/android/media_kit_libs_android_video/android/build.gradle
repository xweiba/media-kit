import java.io.File
import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}

task downloadDependencies(type: Exec) {   
        // Delete previously created /output subdirectory.

        def outputDir = file("$buildDir/output")
        if (outputDir.exists()) {
            outputDir.deleteDir()
        }
        outputDir.mkdirs()

        // Download all *.jar dependencies & verify their SHA-256 checksums.
        def filesToDownload = [
            ["url": "https://raw.githubusercontent.com/xweiba/libmpv-android-video-build/36ef4e96ae7a0ef78c0f2fc0ce8aaa0491909f57/prebuilt/v1.2.7-mediaio.3/default-arm64-v8a.jar", "sha256": "c33d87ca8f2b76ecc7506db9c53331741b8aad01ca554f5ffd6fa5007a43d514", "destination": file("$buildDir/v1.2.7-mediaio.3/default-arm64-v8a.jar")],
            ["url": "https://raw.githubusercontent.com/xweiba/libmpv-android-video-build/36ef4e96ae7a0ef78c0f2fc0ce8aaa0491909f57/prebuilt/v1.2.7-mediaio.3/default-armeabi-v7a.jar", "sha256": "adcc4f0b8b9909974e64103a60e25d5e03eb5b873d2bfbe4102fa3b40b32f74e", "destination": file("$buildDir/v1.2.7-mediaio.3/default-armeabi-v7a.jar")],
            ["url": "https://raw.githubusercontent.com/xweiba/libmpv-android-video-build/36ef4e96ae7a0ef78c0f2fc0ce8aaa0491909f57/prebuilt/v1.2.7-mediaio.3/default-x86_64.jar", "sha256": "0dfc4fb3539bc26059c044f59a680bdabeb59d1ef1319c8241c76d38e5f8a554", "destination": file("$buildDir/v1.2.7-mediaio.3/default-x86_64.jar")],
            ["url": "https://raw.githubusercontent.com/xweiba/libmpv-android-video-build/36ef4e96ae7a0ef78c0f2fc0ce8aaa0491909f57/prebuilt/v1.2.7-mediaio.3/default-x86.jar", "sha256": "8a974a7564353d7b16a6dd45ba110aa277eadb84da7bb08785a903848a8d543a", "destination": file("$buildDir/v1.2.7-mediaio.3/default-x86.jar")]
        ]

        filesToDownload.each { fileInfo ->
            def destFile = fileInfo.destination
            if (destFile.exists()) {
                def calculatedSHA256 = MessageDigest.getInstance("SHA-256").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()

                if (calculatedSHA256 != fileInfo.sha256) {
                    destFile.delete()
                    println "SHA-256 mismatch. File deleted: ${destFile}"
                }

            }

            if (!destFile.exists()) {
                destFile.parentFile.mkdirs()
                println "Downloading file from: ${fileInfo.url}"
                destFile.withOutputStream { os ->
                    os << new URL(fileInfo.url).openStream()
                }

                def calculatedSHA256 = MessageDigest.getInstance("SHA-256").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()
                if (calculatedSHA256 != fileInfo.sha256) {
                    throw new GradleException("SHA-256 verification failed for ${destFile}")
                }
            }

            copy {
                from destFile
                into outputDir
            }
        }
}

assemble.dependsOn(downloadDependencies)
