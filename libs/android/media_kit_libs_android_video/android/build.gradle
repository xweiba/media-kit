import java.io.File
import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}

task downloadDependencies(type: Exec) {   
        // Delete previously created /output subdirectory.

        def outputDir = file("$buildDir/output")
        if (outputDir.exists()) {
            outputDir.deleteDir()
        }
        outputDir.mkdirs()

        // Download all *.jar dependencies & verify their SHA-256 checksums.
        def filesToDownload = [
            ["url": "https://raw.githubusercontent.com/xweiba/libmpv-android-video-build/ee7f9cf464cc505ac06f71eda3aaf50a58289edc/prebuilt/v1.2.7-mediaio.4/default-arm64-v8a.jar", "sha256": "2e80364b3f838f06394c138a30d02a3aef4f6c71fd69d9521c24294ed58eedc3", "destination": file("$buildDir/v1.2.7-mediaio.4/default-arm64-v8a.jar")],
            ["url": "https://raw.githubusercontent.com/xweiba/libmpv-android-video-build/ee7f9cf464cc505ac06f71eda3aaf50a58289edc/prebuilt/v1.2.7-mediaio.4/default-armeabi-v7a.jar", "sha256": "6a9cd319fe2f21ea5ed6e7b45ed195b41bb4233e0f8b1bb8b97d44acf0380120", "destination": file("$buildDir/v1.2.7-mediaio.4/default-armeabi-v7a.jar")],
            ["url": "https://raw.githubusercontent.com/xweiba/libmpv-android-video-build/ee7f9cf464cc505ac06f71eda3aaf50a58289edc/prebuilt/v1.2.7-mediaio.4/default-x86_64.jar", "sha256": "769282d09052bfcc2ada021fcf60c8736ae0ecf5b6857247149078f184643dfc", "destination": file("$buildDir/v1.2.7-mediaio.4/default-x86_64.jar")],
            ["url": "https://raw.githubusercontent.com/xweiba/libmpv-android-video-build/ee7f9cf464cc505ac06f71eda3aaf50a58289edc/prebuilt/v1.2.7-mediaio.4/default-x86.jar", "sha256": "fe590e483696994b397c25a619093a150e905bbfa6d5ee57e8abd88ca9ef290f", "destination": file("$buildDir/v1.2.7-mediaio.4/default-x86.jar")]
        ]

        filesToDownload.each { fileInfo ->
            def destFile = fileInfo.destination
            if (destFile.exists()) {
                def calculatedSHA256 = MessageDigest.getInstance("SHA-256").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()

                if (calculatedSHA256 != fileInfo.sha256) {
                    destFile.delete()
                    println "SHA-256 mismatch. File deleted: ${destFile}"
                }

            }

            if (!destFile.exists()) {
                destFile.parentFile.mkdirs()
                println "Downloading file from: ${fileInfo.url}"
                destFile.withOutputStream { os ->
                    os << new URL(fileInfo.url).openStream()
                }

                def calculatedSHA256 = MessageDigest.getInstance("SHA-256").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()
                if (calculatedSHA256 != fileInfo.sha256) {
                    throw new GradleException("SHA-256 verification failed for ${destFile}")
                }
            }

            copy {
                from destFile
                into outputDir
            }
        }
}

assemble.dependsOn(downloadDependencies)
